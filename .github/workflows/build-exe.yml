name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to publish the "latest" release

# Only the newest push matters; cancel older builds so they can't race on the release.
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build msg2pdf.exe
        run: python -m PyInstaller --noconfirm --clean msg2pdf.spec

      - name: Get sample .msg files for testing
        run: git clone --depth 1 https://github.com/TeamMsgExtractor/msg-extractor "$env:RUNNER_TEMP\samples"

      - name: Test the exe - convert emails
        shell: pwsh
        run: |
          $samples = "$env:RUNNER_TEMP\samples\example-msg-files"
          $out = "$env:RUNNER_TEMP\test.pdf"
          $p = Start-Process -FilePath dist\msg2pdf.exe -ArgumentList @("--cli", "`"$samples`"", "-o", "`"$out`"", "--sort", "date") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "conversion exited with code $($p.ExitCode)" }
          if (-not (Test-Path $out)) { throw "no PDF was produced" }
          python -c "import pymupdf,sys; d=pymupdf.open(sys.argv[1]); n=sum(1 for p in d for a in p.annots()); print('pages', d.page_count, 'attachments', n); assert d.page_count > 5 and n > 0" $out

      - name: Test the exe - open the window
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath dist\msg2pdf.exe -ArgumentList @("--selftest", "`"$report`"") -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "window self-test failed" }
          if (-not ((Get-Content $report -Raw) -like "ok dnd=True*")) { throw "drag-and-drop support missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: msg2pdf-exe
          path: dist/msg2pdf.exe

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest dist/msg2pdf.exe --title "msg2pdf (latest build)" --notes "Windows program built from commit $env:GITHUB_SHA. Download msg2pdf.exe and double-click it - no Python needed." --target $env:GITHUB_SHA
